<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Neutrino, engenharia de software de alta complexidade</title>
    <meta
      name="description"
      content="Construímos o software que sustenta operações inteiras. Arquitetura e engenharia avançada, da concepção à produção."
    />
    <link rel="canonical" href="https://neutrino.dev.br/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <!--
      Pintado antes do bundle: sem isto o primeiro quadro é branco, e um site
      inteiramente escuro que pisca branco parece quebrado antes de carregar.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #07090c;
        color-scheme: dark;
      }
    </style>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#07090C" />

    <!--
      og:image precisa ser PNG ou JPG: WhatsApp, LinkedIn, Facebook e X não
      renderizam SVG em Open Graph. O site anterior apontava para um .svg, então
      todo compartilhamento saía sem imagem. Gerado por `npm run og`.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Neutrino" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://neutrino.dev.br/" />
    <meta property="og:title" content="Neutrino, engenharia de software de alta complexidade" />
    <meta
      property="og:description"
      content="Construímos o software que sustenta operações inteiras. Arquitetura e engenharia avançada, da concepção à produção."
    />
    <meta property="og:image" content="https://neutrino.dev.br/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Neutrino, engenharia de software de alta complexidade" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Neutrino, engenharia de software de alta complexidade" />
    <meta
      name="twitter:description"
      content="Construímos o software que sustenta operações inteiras. Arquitetura e engenharia avançada, da concepção à produção."
    />
    <meta name="twitter:image" content="https://neutrino.dev.br/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Neutrino Soluções em Tecnologia",
        "alternateName": "Neutrino",
        "url": "https://neutrino.dev.br",
        "description": "Engenharia para sistemas em produção onde a falha técnica tem consequência direta em receita, compliance ou operação.",
        "foundingDate": "2020",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Curitiba",
          "addressRegion": "PR",
          "addressCountry": "BR"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "neutrino@neutrino.dev.br",
          "contactType": "sales"
        },
        "sameAs": [
          "https://www.linkedin.com/company/neutrino-solu%C3%A7%C3%B5es-em-tecnologia/"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 40rem; margin: 0 auto; padding: 6rem 1.5rem; font-family: system-ui; color: #99a2b0">
        <h1 style="color: #f2f5f9">Neutrino</h1>
        <p>
          Arquitetura e engenharia avançada para construir os sistemas de que uma operação inteira passa a depender, da concepção à produção.</p>
        <p>
          Escreva para
          <a style="color: #ffb020" href="mailto:neutrino@neutrino.dev.br">neutrino@neutrino.dev.br</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
